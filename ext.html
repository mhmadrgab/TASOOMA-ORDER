<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="./i18n.js"></script>
<!-- 🚐 صفحة السواق الخارجي (عربية مأجّرة / شركة شحن) — 12 نوفمبر 2026.
     من غير تطبيق ولا تسجيل دخول: الرابط اللي المستودع بعته فيه رمز سري بعد # (مابيتبعتش في أي سجل)، والصفحة بتكلّم سيرفر الإشعارات بالرمز ده بس.
     السيرفر بيدّيها محطات الرحلة دي بس، ويسجّل التسليم والمكان، والرابط بيقفل لما الرحلة تخلص أو بعد 24 ساعة. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
<script>(function(){var ok=true;try{ok=window.top===window.self||window.top.location.origin===location.origin}catch(e){ok=false}if(!ok){document.documentElement.style.display="none";try{window.top.location=window.self.location.href}catch(e){}}})()</script>
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1b1b1b">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>توصيلات تاسومة</title>
<link rel="icon" href="./icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#efede9;--card:#fff;--ink:#1b1b1b;--mut:#6f6b64;--line:#e6e2db;--acc:#a8832f;--soft:#f6f2e9;--field:#f3f1ed;--ok:#2f8f3e}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f0f;--card:#1a1a1a;--ink:#f1efec;--mut:#9d9a94;--line:#2f2f2f;--acc:#d4ae5c;--soft:#221f18;--field:#242424;--ok:#5cc06c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:var(--ink)}input{width:100%;background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:13px 14px}input:focus{outline:none;border-color:var(--acc)}
.hd{background:#1b1b1b;color:#fff;padding:16px 18px calc(16px + 0px);border-bottom:3px solid #d4ae5c;display:flex;align-items:center;gap:12px}
.hd img{width:44px;height:44px;border-radius:10px}.hd b{display:block;font-size:18px}.hd small{color:#cdb67a;font-size:13px}.hd .tzl-btn{margin-inline-start:auto}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.who{display:flex;gap:10px;align-items:center}.who .ic{font-size:34px}.who b{font-size:18px;display:block}.mut{color:var(--mut);font-size:14px}
.gps{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;border-radius:12px;padding:9px 12px;background:#fff1d6;color:#8a5a00;margin-top:10px}.gps.on{background:#e7f4ec;color:#1d5a24}
.st{border-inline-start:6px solid #d4ae5c}.st.done{border-inline-start-color:var(--ok);opacity:.8}
.st h3{margin:0;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.st h3 .n{background:#1b1b1b;color:#fff;border-radius:999px;min-width:28px;height:28px;display:inline-grid;place-items:center;font-size:14px;padding:0 8px}
.b{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:17px;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px;background:var(--soft);color:var(--ink)}
.b.ok{background:var(--ok);color:#fff}.b.p{background:#1b1b1b;color:#fff}.b.g{background:#d4ae5c;color:#1b1b1b}.b:disabled{opacity:.6}
.row{display:flex;gap:8px}.row .b{flex:1}
.mdl{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);overflow:auto;padding:14px}.mdl.on{display:block}.mdl .card{max-width:520px;margin:4vh auto}
label{display:block;color:var(--mut);font-size:14px;margin:12px 0 4px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1b1b;color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90%}#toast.on{opacity:1}#toast.er{background:#c4362b}
.big{text-align:center;padding:40px 18px}.big .ic{font-size:56px}.big h2{margin:8px 0}
</style>
</head>
<body>
<div class="hd"><img src="./icon-192.png" alt=""><div><b>توصيلات تاسومة</b><small id="sub">TASOOMA</small></div><span id="lng"></span></div>
<div class="wrap" id="app"><div class="card big"><div class="ic">⏳</div><h2>جارٍ التحميل…</h2></div></div>
<div class="mdl" id="md"></div><div id="toast"></div>
<script>
"use strict";
const API="https://tasooma-push.tasooma.workers.dev";
const g=id=>document.getElementById(id);
const E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=x=>Number.isFinite(+x)?+x:0;
const hm=t=>new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const toEn=s=>String(s||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
let TT=null;const toast=(m,er)=>{const t=g("toast");t.textContent=m;t.className="on"+(er?" er":"");clearTimeout(TT);TT=setTimeout(()=>t.className="",er?5000:3000)};
if(window.TZL&&TZL.btn)g("lng").innerHTML=TZL.btn();
// الرمز من بعد # (ومش بنسيبه في الرابط اللي ظاهر، علشان لو حد صوّر الشاشة)
let TOK="";try{TOK=(new URLSearchParams(location.hash.slice(1)).get("t")||sessionStorage.getItem("xt")||"").trim();if(TOK){sessionStorage.setItem("xt",TOK);history.replaceState(null,"",location.pathname)}}catch(e){}
let T=null,LOC=null,lastSent=0,watch=null;
const ERR={"bad link":"الرابط غير صحيح. اطلب من المستودع رابطاً جديداً.","closed":"انتهت هذه الرحلة، والرابط لم يعد يعمل. شكراً لك 👏","name":"اكتب اسم المستلم","waybill":"اكتب رقم البوليصة أو صوّر إيصال الشحن","stop":"هذه التوصيلة سُجّلت بالفعل","pickup first":"استلم البضاعة من الفرع المرسل أولاً","too many requests":"محاولات كثيرة، انتظر دقيقة","server":"خطأ مؤقت في الخادم، حاول مجدداً"};
async function api(body){
 const o=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({t:TOK,...body})}:{};
 const r=await fetch(API+"/x"+(body?"":"?t="+encodeURIComponent(TOK)),o);let j={};try{j=await r.json()}catch(e){}
 if(!j.ok)throw Object.assign(new Error(j.error||"http "+r.status),{code:j.error||"",n:j.n});return j;
}
function fatal(ic,t,p){g("app").innerHTML=`<div class="card big"><div class="ic">${ic}</div><h2>${E(t)}</h2>${p?`<p class="mut">${E(p)}</p>`:""}</div>`;stopGps()}
async function load(){
 if(!TOK)return fatal("🔗","الرابط غير كامل","افتح الرابط الذي أرسله لك المستودع كما هو.");
 try{T=await api(null);draw();startGps()}
 catch(e){if(e.code==="closed")fatal("✅","انتهت الرحلة","شكراً لك 👏 الرابط لم يعد يعمل.");else if(e.code==="bad link")fatal("🔗","الرابط غير صحيح","اطلب من المستودع رابطاً جديداً.");else fatal("📶","تعذر الاتصال","تأكد من الإنترنت ثم اسحب الصفحة للتحديث.")}
}
const mapUrl=p=>p?`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=driving`:"";
function draw(){
 const ship=T.type==="ship",st=T.stops||[],left=st.filter(s=>!s.arr);
 g("sub").textContent=ship?"شركة الشحن: "+T.co:"عربية خارجية";
 g("app").innerHTML=`<div class="card"><div class="who"><span class="ic">${ship?"🚚":"🚐"}</span><div><b>أهلاً ${E(T.n)}</b><span class="mut">${E(T.carn||"")} · بدأت ${hm(T.start)} · سلّمت ${st.length-left.length} من ${st.length}</span></div></div>
 <div class="gps ${LOC?"on":""}" id="gps">${LOC?"📡 مكانك يصل إلى المستودع والفرع الآن":"📍 اسمح بالموقع ليعرف الفرع موعد وصولك"}</div>
 ${ship?`<p class="mut" style="margin:10px 0 0">عند استلامك البضاعة سجّل رقم البوليصة (أو صوّر الإيصال) لكل طلب.</p>`:`<p class="mut" style="margin:10px 0 0">عند كل فرع: سلّم البضاعة واضغط "سلّمت"، واكتب اسم المستلم واجعله يوقّع.</p>`}</div>
 ${st.map((s,i)=>{const pk=s.fr&&!s.pk,u=mapUrl(pk?s.from:s.to);
  return `<div class="card st ${s.arr?"done":""}"><h3><span class="n">${i+1}</span><bdi dir="ltr">${E(s.brn)}</bdi>${s.arr?` <span class="mut">✅ ${hm(s.arr)}</span>`:""}</h3>
  <div class="mut"><bdi dir="ltr">${E(s.no)}</bdi> · ${N(s.pcs)} قطعة${s.fr?` · 🔄 يُستلم من <bdi dir="ltr">${E(s.frn||s.fr)}</bdi>${s.pk?" ✅":""}`:""}${s.rcvr?` · استلم: ${E(s.rcvr)}`:""}</div>
  ${s.arr?"":`${u?`<a class="b" href="${E(u)}" target="_blank" rel="noopener noreferrer">🧭 ${pk?"الطريق إلى "+E(s.frn||s.fr):"الطريق على خرائط جوجل"}</a>`:""}
  ${pk?`<button class="b g" data-pk="${E(s.rid)}" type="button">📦 استلمت من <bdi dir="ltr">${E(s.frn||s.fr)}</bdi></button>`:`<button class="b ok" data-arr="${E(s.rid)}" type="button">${ship?"✅ استلمت هذا الطلب (البوليصة)":"✅ سلّمت"}</button>`}`}</div>`}).join("")}
 <div class="card"><button class="b ${left.length?"":"p"}" id="end" type="button">🏁 ${left.length?"إنهاء الرحلة (سيرجع غير المسلَّم للمستودع)":"انتهيت، إنهاء الرحلة"}</button></div>`;
}
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-arr]"),p=e.target.closest("[data-pk]");
 if(a)return podForm(a.dataset.arr);
 if(p)return pickup(p.dataset.pk,p);
 if(e.target.id==="end")return endTrip();
});
async function pickup(rid,btn){
 const s=T.stops.find(x=>x.rid===rid);if(!s||!confirm(`استلمت البضاعة من ${s.frn||s.fr}؟`))return;
 btn.disabled=true;try{await api({op:"pk",rid,...(LOC||{})});T=await api(null);draw();toast("حسناً 📦 الآن أوصلها إلى "+s.brn)}catch(e){btn.disabled=false;toast(ERR[e.code]||"تعذر الحفظ، حاول مجدداً",1)}
}
// تصغير الصورة (نفس فكرة المنصة)
function shrink(file,max,cap){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{let w=im.width,h=im.height;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);let q=.8,d=c.toDataURL("image/jpeg",q);while(d.length>cap&&q>.3){q-=.1;d=c.toDataURL("image/jpeg",q)}d.length>cap?rej(new Error("big")):res(d)};im.src=fr.result};fr.readAsDataURL(file)})}
function podForm(rid){
 const s=T.stops.find(x=>x.rid===rid);if(!s)return;const ship=T.type==="ship";let img="",busy=false,drawn=false;
 g("md").innerHTML=`<div class="card"><h3 style="margin:0">${ship?"🚚 استلام الطلب":"تسليم"} — <bdi dir="ltr">${E(s.brn)}</bdi></h3><div class="mut"><bdi dir="ltr">${E(s.no)}</bdi> · ${N(s.pcs)} قطعة</div>
 ${ship?`<label>رقم البوليصة / الشحنة</label><input id="pw" maxlength="40" dir="ltr" autocomplete="off" placeholder="1234567890">`:""}
 <label>${ship?"اسمك (موظف شركة الشحن)":"اسم المستلم في الفرع"}</label><input id="pn" maxlength="60" autocomplete="off" value="${ship?E(T.n):""}">
 <label>التوقيع (بإصبعك)</label><canvas id="pc" width="320" height="130" style="width:100%;height:130px;background:#fff;border:1.5px dashed var(--line);border-radius:12px;touch-action:none"></canvas><button class="b" id="pcl" type="button" style="padding:8px;margin-top:6px">مسح التوقيع</button>
 <label>${ship?"صورة إيصال الشحن (مطلوبة إن لم يوجد رقم بوليصة)":"صورة التسليم (اختياري)"}</label><input id="pf" type="file" accept="image/*" capture="environment"><small class="mut" id="ph"></small>
 <div class="row"><button class="b" id="p0" type="button">رجوع</button><button class="b ok" id="p1" type="button">تأكيد ✅</button></div></div>`;
 g("md").className="mdl on";
 const cv=g("pc"),cx=cv.getContext("2d");cx.lineWidth=2.4;cx.lineCap="round";cx.strokeStyle="#111";let dn=false;
 const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.onpointerdown=e=>{dn=true;drawn=true;const [x,y]=pt(e);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y+.1);cx.stroke();try{cv.setPointerCapture(e.pointerId)}catch(x){}};
 cv.onpointermove=e=>{if(!dn)return;const [x,y]=pt(e);cx.lineTo(x,y);cx.stroke()};cv.onpointerup=cv.onpointercancel=()=>{dn=false};
 g("pcl").onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);drawn=false};
 g("pf").onchange=async()=>{const f=g("pf").files[0];img="";if(!f)return;busy=true;g("ph").textContent="جارٍ تجهيز الصورة…";try{img=await shrink(f,800,120000);g("ph").textContent="الصورة جاهزة ✅"}catch(e){g("pf").value="";g("ph").textContent="الصورة غير صالحة"}busy=false};
 g("p0").onclick=()=>{g("md").className="mdl";g("md").innerHTML=""};
 g("p1").onclick=async()=>{
  const name=g("pn").value.trim(),wb=ship?toEn(g("pw").value).trim():"";
  if(!name)return toast("اكتب الاسم",1);if(ship&&!wb&&!img)return toast("اكتب رقم البوليصة أو صوّر الإيصال",1);if(busy)return toast("انتظر حتى تجهز الصورة",1);
  g("p1").disabled=true;g("p1").textContent="جارٍ الحفظ…";
  const body={op:"arr",rid,name,...(wb?{wb}:{}),...(img?{img}:{}),...(LOC||{})};
  if(drawn){const sg=cv.toDataURL("image/png");if(sg.length<=40000)body.sig=sg}
  try{const r=await api(body);g("md").className="mdl";g("md").innerHTML="";T=await api(null);draw();toast(r.left?"تم التسجيل ✅":"تم ✅ سلّمت كل التوصيلات. اضغط 🏁 إنهاء الرحلة")}
  catch(e){g("p1").disabled=false;g("p1").textContent="تأكيد ✅";toast(ERR[e.code]||"تعذر الحفظ، تأكد من الإنترنت وحاول مجدداً",1)}
 };
}
async function endTrip(){
 const left=(T.stops||[]).filter(s=>!s.arr).length;
 if(!confirm(left?`لم تُسلَّم ${left} توصيلة بعد، وسترجع إلى المستودع. إنهاء الرحلة؟`:"إنهاء الرحلة؟ بعدها لن يعمل هذا الرابط."))return;
 const b=g("end");b.disabled=true;
 try{await api({op:"end",...(LOC||{})});sessionStorage.removeItem("xt");fatal("✅","انتهت الرحلة","شكراً لك 👏 تم إبلاغ المستودع.")}
 catch(e){b.disabled=false;toast(ERR[e.code]||"تعذر الإنهاء، حاول مجدداً",1)}
}
// المكان: كل 25 ثانية بالكتير وهي مفتوحة (السيرفر بيحدد بنفسه إمتى يكتب)
function startGps(){
 if(watch!=null||!("geolocation" in navigator))return;
 watch=navigator.geolocation.watchPosition(p=>{
  LOC={lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)};const el=g("gps");if(el){el.className="gps on";el.textContent="📡 مكانك يصل إلى المستودع والفرع الآن"}
  if(Date.now()-lastSent<25000||document.hidden)return;lastSent=Date.now();
  const sp=p.coords.speed;api({op:"loc",...LOC,...(Number.isFinite(sp)&&sp>=0?{spd:Math.round(sp*3.6)}:{})}).catch(e=>{if(e.code==="closed"||e.code==="bad link")load()});
 },()=>{const el=g("gps");if(el){el.className="gps";el.textContent="📍 الموقع مغلق: اسمح بالموقع ليعرف الفرع موعد وصولك"}},{enableHighAccuracy:true,maximumAge:15000,timeout:30000});
}
function stopGps(){if(watch!=null){try{navigator.geolocation.clearWatch(watch)}catch(e){}watch=null}}
// لو المستودع أنهى الرحلة أو حد سجّل حاجة: نحدّث كل دقيقة
setInterval(()=>{if(T&&!document.hidden&&!g("md").classList.contains("on"))api(null).then(j=>{T=j;draw()}).catch(e=>{if(e.code==="closed")fatal("✅","انتهت الرحلة","شكراً لك 👏 الرابط لم يعد يعمل.")})},60000);
load();
</script>
</body>
</html>
